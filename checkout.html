<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LowQuality | Checkout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">
</head>

<body>
<header class="site-header">
    <a href="index.html#home">
        <img class="logo" id="site-logo" src="assets/icons/logo_b.png" alt="LowQuality Logo">
    </a>

    <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Toggle Navigation">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
    </button>

    <nav id="nav-menu">
        <a href="index.html#home">Home</a>
        <a href="index.html#featured">Featured</a>
        <a href="merch.html">Merch</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
    </nav>

    <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
            <span id="theme-icon">🌙</span>
        </button>

        <a href="cart.html" class="cart-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span>Cart (<span id="cart-count">0</span>)</span>
        </a>
    </div>
</header>

    <main class="checkout-page">
        <section class="section">
            <p class="eyebrow">Final Step</p>
            <h2>Order Checkout</h2>

            <div class="checkout-grid">
                <!-- Order Summary Column -->
                <div class="checkout-summary-box">
                    <h3>Order Summary</h3>
                    <div id="checkout-items-list" class="checkout-items-list">
                        <!-- Items dynamically injected -->
                    </div>
                    <div class="checkout-total-row">
                        <span>Total:</span>
                        <span id="checkout-total-price">R0.00</span>
                    </div>
                </div>

                <!-- Checkout Form Column -->
                <div class="checkout-form-box">
                    <form action="https://formsubmit.co/3362db90eb63ec561bc05fd7324d6969" method="POST" id="checkout-form" class="contact-form">
                        <!-- Configuration Inputs for FormSubmit -->
                        <input type="hidden" name="_subject" value="NEW LOWQUALITY ORDER">
                        <input type="hidden" name="_next" value="https://lowquality.co.za/order-confirmed.html">
                        <input type="hidden" name="_template" value="table">
                        <input type="hidden" name="_captcha" value="false">
                        
                        <!-- Hidden payload containing cart items, size, color, & total -->
                        <input type="hidden" name="Order_Details" id="hidden-order-details">

                        <label class="form-label">Contact Details</label>
                        <input type="email" name="Customer_Email" placeholder="Your Email Address" autocomplete="email" required>
                        <input type="tel" name="Customer_Phone" placeholder="Phone / WhatsApp Number" required>

                        <label class="form-label">Shipping / Delivery Address</label>
                        <textarea name="Shipping_Address" placeholder="Full Street Address, City, Postal Code" rows="4" required></textarea>

                        <label class="form-label">Additional Order Notes (Optional)</label>
                        <textarea name="Notes" placeholder="Size specifics, custom requests, etc." rows="3"></textarea>

                        <button type="submit" class="btn btn-light checkout-submit-btn">
                            Proceed to Payment
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 LowQuality. All rights reserved.</p>
        <p>Designed with purpose.</p>
    </footer>

    <script type="module" src="script.js"></script>
</body>

</html>
